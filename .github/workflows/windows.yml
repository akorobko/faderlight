# Windows is a target platform but has no free runner, so instead of gating every PR it runs the
# tests on GitHub's cloud runner after each merge to main (or by hand). PRs are gated on the Mac
# (pr-check.yml).

name: Windows tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
