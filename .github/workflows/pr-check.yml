# The pull-request gate. While the repository is private it runs on the maintainer's Mac
# through a self-hosted runner, which is not billed; the Mac is the primary target platform.
# Once the repository is public it runs on GitHub's macOS runner instead, which is free for
# public repositories: a PR from a fork must never run its code on the Mac, and a public
# repository's run logs are public, so they must not show the Mac's folders or name.
#
# Drafts are for reading, so nothing runs for one. Marking a PR ready asks for the gate, and every
# push after that re-runs it. `checkout` on a `pull_request` event takes the merge of the branch
# into its base, so this checks the merged result.

name: PR check

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

# A newer push supersedes the older run of the same PR.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pins Node from .nvmrc instead of whatever Node the Mac has installed. No npm cache step:
      # ~/.npm already persists between runs on the self-hosted runner.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci

      # Vendor guard, Prettier, ESLint, tsc and Vitest; see AGENTS.md.
      - run: npm run check

      # The virtual deck in Chromium (tools/virtual-deck/e2e). Playwright downloads its browser
      # once into its cache in the runner's home folder; later runs find it there.
      - run: npx playwright install chromium
      - run: npm run e2e
