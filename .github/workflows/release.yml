# Releases. Pushing a tag vX.Y.Z (see packages/plugin/README.md, "Releasing") packs the plugin
# and opens a *draft* GitHub release with the .streamDeckPlugin file and the version's
# CHANGELOG.md section. The maintainer reads the draft and publishes it; nothing is public
# before that.
#
# It runs where the PR gate runs (pr-check.yml): the maintainer's Mac while the repository is
# private, GitHub's macOS runner once it is public, whose logs anyone can read. Only people who
# can push tags start this workflow, and it runs code that is already in the repository.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-latest' }}
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - run: npm ci

      # Vendor guard, Prettier, ESLint, tsc and Vitest; see AGENTS.md.
      - run: npm run check

      # Fails unless the tag, packages/plugin/package.json and CHANGELOG.md agree. Writes
      # dist/Faderlight-<version>.streamDeckPlugin and dist/release-notes.md.
      - run: npm run plugin:pack -- --expect "$TAG"

      - name: Draft the GitHub release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.TAG;
            const version = tag.replace(/^v/, '');
            const name = `Faderlight-${version}.streamDeckPlugin`;
            const file = `dist/${name}`;
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Faderlight ${version}`,
              body: fs.readFileSync('dist/release-notes.md', 'utf8'),
              draft: true,
            });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo,
              release_id: release.id,
              name,
              data: fs.readFileSync(file),
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': fs.statSync(file).size,
              },
            });
            core.notice(`Draft release ${release.html_url}`);
