# Dependency updates: one grouped pull request a week per ecosystem for minor and patch
# versions, and one per package for a major version. Each goes through the PR gate
# (ci.yml) and the maintainer's review, like any other pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Node's types follow the Node that runs the plugin (24, see .nvmrc), not the newest Node.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
