name: Task
description: One unit of work, usually a milestone task from docs/design/05-agentic-plan.md.
body:
  - type: input
    id: milestone
    attributes:
      label: Milestone task
      placeholder: M1.1 OSC codec
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist or work when this is done, and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer can check it without hardware (tests, renders, screenshots).
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware questions
      description: Anything that needs a capture or a check on a real interface.
